<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Divisas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Nueva tipografía de Google Fonts (Estudiante B) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            /* Nuevo esquema de colores: degradado índigo y púrpura */
            background: linear-gradient(135deg, #0f172a, #311042, #4f46e5);
            font-family: 'Poppins', sans-serif;
            color: #1e293b;
            min-height: 100vh;
            margin: 0;
        }
        .converter-card {
            border-radius: 24px;
            backdrop-filter: blur(12px);
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.3);
            width: 100%;
            max-width: 420px;
        }
        h2 {
            font-weight: 700;
            color: #312e81;
        }
        .btn-custom {
            background: linear-gradient(90deg, #4f46e5, #7c3aed);
            border: none;
            color: #ffffff;
            font-weight: 600;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .btn-custom:hover {
            background: linear-gradient(90deg, #4338ca, #6d28d9);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(79, 70, 229, 0.3);
        }
        .result-box {
            font-size: 1.5rem;
            font-weight: 700;
            color: #4f46e5;
            background-color: #eef2ff;
            padding: 12px;
            border-radius: 12px;
        }
        /* Reglas para hacer la aplicación responsive en pantallas pequeñas */
        @media (max-width: 576px) {
            .converter-card {
                padding: 1.5rem !important;
                border-radius: 16px;
            }
            h2 {
                font-size: 1.4rem;
            }
            .result-box {
                font-size: 1.25rem;
            }
        }
        /* ---- Navbar (Estudiante A) ---- */
        .app-navbar {
            font-family: 'Poppins', sans-serif;
            background: rgba(10, 20, 45, 0.85);
            backdrop-filter: blur(8px);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
        }
        .app-navbar .navbar-brand {
            font-weight: 700;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .app-navbar .nav-link {
            font-weight: 600;
            margin-left: 12px;
            transition: color 0.2s;
        }
        .app-navbar .nav-link:hover,
        .app-navbar .nav-link.active {
            color: #ffc107 !important;
        }
        .main-content {
            min-height: calc(100vh - 70px);
            padding: 15px;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-md navbar-dark app-navbar sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/">
                <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
                    <circle cx="17" cy="17" r="16" fill="#ffc107"/>
                    <text x="17" y="23" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3c72">€$</text>
                </svg>
                CurrencyApp
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                    aria-controls="mainNav" aria-expanded="false" aria-label="Abrir menú">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="mainNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link active" href="/">Conversor</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Tipos de cambio</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Acerca de</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="main-content d-flex justify-content-center align-items-center">
        <div class="card shadow-lg p-4 converter-card">
            <h2 class="text-center mb-4 fw-bold">💱 CurrencyApp</h2>

            <form method="post">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Cantidad</label>
                    <input type="number" step="0.01" name="amount" 
                           class="form-control form-control-lg" 
                           placeholder="Introduce cantidad" required>
                </div>

                <div class="row mb-3 g-2">
                    <div class="col-12 col-sm-5">
                        <select name="from_currency" class="form-select">
                            <option value="EUR">EUR €</option>
                            <option value="USD">USD $</option>
                            <option value="GBP">GBP £</option>
                        </select>
                    </div>
                    <div class="col-12 col-sm-2 text-center align-self-center fw-bold">
                        →
                    </div>
                    <div class="col-12 col-sm-5">
                        <select name="to_currency" class="form-select">
                            <option value="USD">USD $</option>
                            <option value="EUR">EUR €</option>
                            <option value="GBP">GBP £</option>
                        </select>
                    </div>
                </div>

                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-custom btn-lg">
                        Convertir
                    </button>
                </div>
            </form>

            {% if result is not none %}
                <div class="mt-4 text-center result-box">
                    {{ result }}
                </div>
            {% endif %}
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
